<html lang="en">
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self'; media-src 'self' blob: mediastream:">
  <title>Monitor 2</title>
  <link rel="stylesheet" href="monitor.css">
  <link rel="stylesheet" href="../shared/aurora-aux.css">
</head>
<body>
  <video id="video" autoplay muted playsinline disablepictureinpicture disableremoteplayback></video>
  <canvas id="framegen" class="hidden"></canvas>
  <audio id="audio" autoplay></audio>
  <div id="overlay" data-i18n="monitor.not_sharing">Mac is not sharing</div>
  <pre id="stats" class="hidden"></pre>
  <div id="drop-status" class="hidden"></div>
  <div id="bar">
    <button id="b-extend" data-i18n="monitor.extend" data-i18n-title="monitor.extend_title" title="Use this window as an extra screen of the other computer" hidden>Extend</button>
    <button id="b-mirror" data-i18n="monitor.mirror" data-i18n-title="monitor.mirror_title" title="Show the other computer’s main screen" hidden>Mirror</button>
    <span class="sep" id="sep-mode" hidden></span>
    <button id="b-fg" data-i18n="monitor.fg" data-i18n-title="monitor.fg_title" title="Frame generation: fills in late or dropped frames">Frame generation</button>
    <button id="b-full" data-i18n="monitor.fullscreen" data-i18n-title="monitor.fullscreen_title" title="Full screen (F11)">Full screen</button>
    <span class="sep" id="sep-stop" hidden></span>
    <button id="b-stop" data-i18n="monitor.stop" data-i18n-title="monitor.stop_title" title="Stop sharing on the other computer" hidden>Stop</button>
  </div>
  <script src="../shared/locales/en.js"></script>
  <script src="../shared/locales/pt-BR.js"></script>
  <script src="../shared/i18n.js"></script>
  <script src="../shared/i18n-dom.js"></script>
  <script src="../shared/protocol.js"></script>
  <script src="../shared/framegen.js"></script>
  <script src="monitor.js"></script>
  <script src="monitor-input.js"></script>
  <script src="monitor-drop.js"></script>
  <script src="monitor-apps.js"></script>
  <script src="monitor-bar.js"></script>
</body>
</html>
