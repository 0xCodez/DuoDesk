<html lang="en">
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self'">
  <title>MacShare</title>
  <link rel="stylesheet" href="app.css">
</head>
<body>
  <main>
    <section class="card" id="status-card">
      <div class="status-row">
        <span class="dot" id="status-dot"></span>
        <div>
          <div class="status-text" id="status-text">Starting…</div>
          <div class="sub" id="status-detail"></div>
        </div>
      </div>
      <div class="sub" id="input-line">Input: Home</div>
    </section>

    <section class="card pairing hidden" id="pairing-card">
      <h2 id="pairing-title">Pairing</h2>
      <div class="code hidden" id="pairing-code"></div>
      <p id="pairing-text"></p>
      <div class="buttons">
        <button class="primary hidden" id="btn-match">Codes match</button>
        <button id="btn-cancel">Cancel</button>
      </div>
    </section>

    <section class="card hidden" id="paired-card">
      <h2>Paired Mac</h2>
      <div class="row">
        <div>
          <div class="name" id="paired-name"></div>
          <div class="sub" id="paired-address"></div>
        </div>
        <button id="btn-forget">Forget</button>
      </div>
    </section>

    <section class="card">
      <h2>Macs on this network</h2>
      <ul id="mac-list"></ul>
      <div class="sub" id="mac-empty">Looking for Macs… (start MacShare on the Mac)</div>
      <form id="add-ip" class="row">
        <input id="ip" placeholder="Add by IP, e.g. 192.168.1.20" autocomplete="off" spellcheck="false">
        <button type="submit">Pair</button>
      </form>
    </section>

    <section class="card">
      <h2>Screen</h2>
      <div class="row">
        <div class="sub" id="stream-state">Mac is not sharing</div>
        <button id="btn-monitor" disabled>Open Monitor 2</button>
      </div>
    </section>
  </main>
  <script src="app.js"></script>
</body>
</html>
