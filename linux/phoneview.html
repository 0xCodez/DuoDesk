<html lang="en">
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self'; worker-src 'self'">
  <title data-i18n="phoneview.title">Phone</title>
  <link rel="stylesheet" href="phoneview.css">
  <link rel="stylesheet" href="../shared/aurora-aux.css">
</head>
<body>
  <header id="bar">
    <button id="panelBtn" class="on" title="Show or hide the phone controls" aria-label="Show or hide the phone controls" data-i18n-title="phoneview.controls_toggle" data-i18n-aria-label="phoneview.controls_toggle"><svg viewBox="0 0 20 20"><rect x="3" y="4" width="14" height="12" rx="2"/><path d="M12.5 4v12"/></svg></button>
    <span id="title"></span>
    <span id="via" hidden></span>
    <span class="tools">
      <button id="b-back" title="Back (Esc)" aria-label="Back" data-i18n-title="phoneview.back_esc" data-i18n-aria-label="phoneview.back"><svg viewBox="0 0 20 20"><path d="M12.5 4.5 7 10l5.5 5.5"/></svg></button>
      <button id="b-home" title="Home" aria-label="Home" data-i18n-title="phoneview.home" data-i18n-aria-label="phoneview.home"><svg viewBox="0 0 20 20"><circle cx="10" cy="10" r="5.5"/></svg></button>
      <button id="b-recents" title="Recent apps" aria-label="Recent apps" data-i18n-title="phoneview.recents" data-i18n-aria-label="phoneview.recents"><svg viewBox="0 0 20 20"><rect x="5" y="5" width="10" height="10" rx="1.5"/></svg></button>
      <button id="b-notifs" title="Notifications" aria-label="Notifications" data-i18n-title="phoneview.notifs" data-i18n-aria-label="phoneview.notifs"><svg viewBox="0 0 20 20"><path d="M5.5 13.5V9a4.5 4.5 0 0 1 9 0v4.5l1.5 1.5h-12z M8.5 16.5a1.5 1.5 0 0 0 3 0"/></svg></button>
      <button id="b-rotate" title="Rotate" aria-label="Rotate" data-i18n-title="phoneview.rotate" data-i18n-aria-label="phoneview.rotate"><svg viewBox="0 0 20 20"><path d="M4.5 10a5.5 5.5 0 1 0 1.6-3.9 M4.5 3.5v3h3"/></svg></button>
      <button id="b-torch" title="Flashlight / Torch" aria-label="Torch" data-i18n-title="phoneview.torch_tooltip" data-i18n-aria-label="phoneview.torch"><svg viewBox="0 0 20 20"><path d="M7 3h6v4l-2 3v7H9v-7L7 7z"/></svg></button>
      <button id="b-flip" title="Switch Camera" aria-label="Switch Camera" data-i18n-title="phoneview.switch_camera" data-i18n-aria-label="phoneview.switch_camera"><svg viewBox="0 0 20 20"><path d="M3 7h14 M14 4l3 3-3 3 M17 13H3 M6 10l-3 3 3 3"/></svg></button>
      <button id="b-zoomin" title="Zoom In" aria-label="Zoom In" data-i18n-title="phoneview.zoom_in" data-i18n-aria-label="phoneview.zoom_in"><svg viewBox="0 0 20 20"><circle cx="9" cy="9" r="6"/><line x1="13.5" y1="13.5" x2="18" y2="18"/><line x1="9" y1="6" x2="9" y2="12"/><line x1="6" y1="9" x2="12" y2="9"/></svg></button>
      <button id="b-zoomout" title="Zoom Out" aria-label="Zoom Out" data-i18n-title="phoneview.zoom_out" data-i18n-aria-label="phoneview.zoom_out"><svg viewBox="0 0 20 20"><circle cx="9" cy="9" r="6"/><line x1="13.5" y1="13.5" x2="18" y2="18"/><line x1="6" y1="9" x2="12" y2="9"/></svg></button>
    </span>
    <button id="fullBtn" title="Fullscreen (F11)" aria-label="Fullscreen" data-i18n-title="phoneview.fullscreen_f11" data-i18n-aria-label="phoneview.fullscreen"><svg viewBox="0 0 20 20"><path d="M4 8V4h4 M12 4h4v4 M16 12v4h-4 M8 16H4v-4"/></svg></button>
  </header>
  <main id="stage">
    <canvas id="screen" tabindex="0"></canvas>
    <div id="status" data-i18n="phoneview.connecting">Connecting to the phone…</div>
  </main>
  <script src="../shared/locales/en.js"></script>
  <script src="../shared/locales/pt-BR.js"></script>
  <script src="../shared/i18n.js"></script>
  <script src="../shared/i18n-dom.js"></script>
  <script src="../shared/vcam-feed.js"></script>
  <script src="phoneview-renderer.js"></script>
</body>
</html>
