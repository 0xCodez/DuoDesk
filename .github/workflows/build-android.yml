name: Build Android

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      # Signed with the ANDROID_KEYSTORE secret when it's there, so the APKs install over the ones
      # people already have (and the computers can install the full one over the standard one).
      # Without it they're signed with this runner's own debug key: fine to try, but they won't
      # install over a build signed with yours.
      - name: Signing key
        env:
          KEYSTORE: ${{ secrets.ANDROID_KEYSTORE }}
        run: |
          if [ -z "$KEYSTORE" ]; then
            echo "::warning::No ANDROID_KEYSTORE secret: signed with the runner's debug key"
          else
            mkdir -p ~/.android
            echo "$KEYSTORE" | base64 -d > ~/.android/debug.keystore
          fi

      - name: Build the standard and full APKs
        working-directory: android
        run: |
          ./gradlew --no-daemon assembleRelease
          v=$(grep -m1 versionName app/build.gradle.kts | sed 's/.*"\(.*\)".*/\1/')
          mkdir -p dist
          cp app/build/outputs/apk/standard/release/app-standard-release.apk "dist/TwinDesk-$v.apk"
          cp app/build/outputs/apk/full/release/app-full-release.apk "dist/TwinDesk-$v-full.apk"

      - name: Upload APKs
        uses: actions/upload-artifact@v4
        with:
          name: twindesk-android
          path: android/dist/TwinDesk-*.apk
