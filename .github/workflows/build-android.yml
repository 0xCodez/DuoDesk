name: Build Android

on:
  # A pushed v* tag builds and puts the files on that tag's release (made as a prerelease).
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: Release to put the files on (e.g. v2.0.1; made as a draft prerelease if it isn't there). Empty = run artifacts only.
        required: false
        default: ''
      ref:
        description: Branch to build (a test branch; releases come from main).
        required: false
        default: main

# The release the files go on: the dispatch's tag, or the pushed tag; empty = run artifacts only
# (a dispatch started from a tag with no tag input builds main, so it doesn't go on that tag's release).
env:
  TAG: ${{ inputs.tag || (github.event_name == 'push' && github.ref_type == 'tag' && github.ref_name) || '' }}

# Write: the files can go straight onto a release.
permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
      # Dispatch: main unless another branch is asked for (ref), whichever branch the run was started
      # from. Tag push: the pushed tag.
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || (github.event_name == 'workflow_dispatch' && 'main') || github.ref }}

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      # Signed with the ANDROID_KEYSTORE secret when it's there, so the APKs install over the ones
      # people already have (and the computers can install the full one over the standard one).
      # Without it they're signed with this runner's own debug key: fine to try, but they won't
      # install over a build signed with yours.
      - name: Signing key
        env:
          KEYSTORE: ${{ secrets.ANDROID_KEYSTORE }}
        run: |
          if [ -z "$KEYSTORE" ]; then
            echo "::warning::No ANDROID_KEYSTORE secret: signed with the runner's debug key"
          else
            mkdir -p ~/.android
            echo "$KEYSTORE" | base64 -d > ~/.android/debug.keystore
          fi

      - name: Build the standard and full APKs
        working-directory: android
        run: |
          ./gradlew --no-daemon assembleRelease
          v=$(grep -m1 versionName app/build.gradle.kts | sed 's/.*"\(.*\)".*/\1/')
          mkdir -p dist
          cp app/build/outputs/apk/standard/release/app-standard-release.apk "dist/DuoDesk-$v.apk"
          cp app/build/outputs/apk/full/release/app-full-release.apk "dist/DuoDesk-$v-full.apk"

      - name: Upload APKs
        uses: actions/upload-artifact@v4
        with:
          name: duodesk-android
          path: android/dist/DuoDesk-*.apk

      # Straight onto the release, no download and re-upload.
      - name: Upload to the release
        if: env.TAG != ''
        env:
          GH_TOKEN: ${{ github.token }}
          # A tag push publishes the prerelease straight away: the workflows run side by side, and
          # drafts (no tag of their own yet) would be made once each. A dispatch makes a draft.
          DRAFT: ${{ github.event_name != 'push' && 'true' || '' }}
        run: |
          gh release view "$TAG" >/dev/null 2>&1 || gh release create "$TAG" ${DRAFT:+--draft} --prerelease --target "$(git rev-parse HEAD)" --title "$TAG" --notes "" || true
          gh release upload "$TAG" android/dist/DuoDesk-*.apk --clobber
