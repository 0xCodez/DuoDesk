name: Build Windows

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-2022

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: ./.github/actions/android-full
        with:
          keystore: ${{ secrets.ANDROID_KEYSTORE }}

      - name: Install dependencies
        working-directory: windows
        run: npm install

      # The helper builds with .NET Framework's csc.exe, which the runner has. One AnyCPU helper
      # serves both installers.
      - name: Build the installers (x64 and arm64)
        working-directory: windows
        run: npm run dist -- x64 arm64

      - name: Upload installers
        uses: actions/upload-artifact@v4
        with:
          name: twindesk-windows
          path: windows/dist/*.exe
