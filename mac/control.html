<html lang="en">
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:">
  <title>MacShare</title>
  <link rel="stylesheet" href="control.css">
  <link rel="stylesheet" href="control-pages.css">
</head>
<body>
  <nav id="sidebar" aria-label="Sections">
    <div class="identity">
      <div class="app-mark" aria-hidden="true"></div>
      <div class="who">
        <div class="app-name">MacShare</div>
        <div class="peer"><span id="peer-dot" class="dot"></span><span id="peer-text">No PC</span></div>
      </div>
    </div>
    <ul id="nav" role="tablist"></ul>
  </nav>

  <main id="content">
    <div class="drag-strip" aria-hidden="true"></div>
    <section id="banner" class="banner" hidden>
      <div class="banner-text">
        <strong id="pair-name"></strong> wants to pair
        <span class="code-label">Code</span> <span id="pair-code" class="code"></span>
        <div id="pair-hint" class="hint"></div>
      </div>
      <div class="banner-actions">
        <button id="pair-deny" class="btn">Deny</button>
        <button id="pair-allow" class="btn primary">Allow</button>
      </div>
    </section>
    <div id="pages"></div>
  </main>

  <script src="../shared/protocol.js"></script>
  <script src="control.js"></script>
  <script src="ui-overview.js"></script>
  <script src="ui-display.js"></script>
  <script src="ui-display-pc.js"></script>
  <script src="ui-cursor.js"></script>
  <script src="ui-keyboard.js"></script>
  <script src="ui-clipboard.js"></script>
  <script src="ui-audio.js"></script>
  <script src="ui-terminal.js"></script>
  <script src="ui-files.js"></script>
  <script src="ui-apps.js"></script>
  <script src="ui-general.js"></script>
  <script src="ui-start.js"></script>
</body>
</html>
